name: Experiment — AC/SC

# Develocity Artifact Cache + Setup Cache variant. See experiment-matrix.yml.
# Find the scans with: tag:<experiment_id>_ac_sc_<no_cc|cc|ip>

on:
  workflow_dispatch:
    inputs:
      task:
        description: "Gradle task to execute"
        required: true
        default: "assembleDebug"
      iterations:
        description: "Measured builds per scenario"
        required: true
        default: "10"
      max_parallel:
        description: "Concurrent iterations"
        required: true
        default: "10"
      experiment_id:
        description: "Prefix of the variant tags; reuse it in the baseline dispatch to compare the two"
        required: true
        default: "exp1"
      extra_args:
        description: "Extra Gradle arguments"
        required: false
        default: ""

run-name: "ac_sc · ${{ inputs.experiment_id }} · ${{ inputs.task }} · ${{ inputs.iterations }} iterations"

jobs:
  experiment:
    uses: ./.github/workflows/experiment-matrix.yml
    with:
      ac_sc: true
      task: ${{ inputs.task }}
      iterations: ${{ inputs.iterations }}
      max_parallel: ${{ inputs.max_parallel }}
      experiment_id: ${{ inputs.experiment_id }}
      extra_args: ${{ inputs.extra_args }}
    secrets:
      DEVELOCITY_ACCESS_KEY: ${{ secrets.DEVELOCITY_ACCESS_KEY }}
