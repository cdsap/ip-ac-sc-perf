name: Experiment matrix

# Reusable workflow called by the three dispatchers:
#   experiment-ac-sc.yml       mode = ac_sc       Develocity Artifact Cache + Setup Cache
#   experiment-baseline.yml    mode = no_ac_sc    control group, no cache step
#   experiment-deps-cache.yml  mode = deps_cache  Telltale-style: dependencies + wrapper only
#
# Modelled on cdsap/Telltale: every measured build is its own job on a fresh
# runner, so nothing carries over between iterations. The matrix is
# scenario x iteration (3 x N):
#
#   no_cc  --no-configuration-cache, isolated projects off
#   cc     --configuration-cache,    isolated projects off
#   ip     isolated projects on (implies the configuration cache)
#
# Configuration cache entries are never reused: each runner starts empty, and
# in the AC/SC variant .gradle/configuration-cache is deleted after the Setup
# Cache restore. The cc/ip scenarios therefore always store a fresh entry,
# which is the cost we want to measure.
#
# AC/SC variant: no seed job. Each iteration restores and stores through the
# Develocity Artifact Cache action itself, as it would on real CI, under a
# scenario-specific image name.
#
# deps_cache variant only: like Telltale's "dependencies cache" mode, a single
# seed job runs first and saves ~/.gradle/caches/modules-2 and
# ~/.gradle/wrapper/dists to the GitHub Actions cache, keyed by run. Measured
# iterations restore exactly those two paths and nothing else: no transforms,
# no build cache, no Setup Cache content.
#
# Every measured scan is tagged:
#   <experiment_id>_<mode>_<scenario>             the variant, for BuildExperimentResults
#   <task>                                        the task, e.g. assembleDebug (seeds too)
#   experiment, ip-ac-sc-perf, run_<run_id>       batch identification
# and carries custom values scenario, iteration, mode and ac_sc.

on:
  workflow_call:
    inputs:
      mode:
        description: "ac_sc | no_ac_sc | deps_cache"
        type: string
        required: true
      task:
        type: string
        required: true
      iterations:
        type: string
        required: true
      max_parallel:
        type: string
        required: true
      experiment_id:
        type: string
        required: true
      extra_args:
        type: string
        required: false
        default: ""
    secrets:
      DEVELOCITY_ACCESS_KEY:
        required: true

env:
  # ge.solutions-team.gradle.com 308-redirects here; the AC action does not follow redirects.
  DEVELOCITY_URL: https://solutions.develocity.cloud
  DEPS_CACHE_KEY: deps-wrapper-${{ github.run_id }}

jobs:
  # Turns the iteration count into a JSON array the matrix can consume,
  # e.g. 3 -> ["1","2","3"]. GitHub has no native range expression.
  iterations:
    name: Generate Iterations
    runs-on: ubuntu-latest
    outputs:
      iterations: ${{ steps.calculate.outputs.iterations }}
    steps:
      - id: calculate
        run: |
          n='${{ inputs.iterations }}'
          case "$n" in
            ''|*[!0-9]*) echo "iterations must be a positive integer, got '$n'" >&2; exit 1 ;;
          esac
          [ "$n" -ge 1 ] || { echo "iterations must be >= 1" >&2; exit 1; }
          # 3 scenarios per iteration; the matrix caps at 256 jobs.
          [ "$n" -le 85 ] || { echo "iterations must be <= 85 (3 scenarios x 85 = 255 jobs)" >&2; exit 1; }
          list=$(jq -nc --argjson n "$n" '[range(1; $n + 1) | tostring]')
          echo "generated $n iterations: $list"
          echo "iterations=$list" >> "$GITHUB_OUTPUT"
      - run: |
          case '${{ inputs.mode }}' in
            ac_sc|no_ac_sc|deps_cache) ;;
            *) echo "mode must be ac_sc, no_ac_sc or deps_cache, got '${{ inputs.mode }}'" >&2; exit 1 ;;
          esac

  seed-deps:
    name: "Seed dependencies + wrapper"
    if: inputs.mode == 'deps_cache'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '23'

      - name: Build
        run: |
          task_tag=$(echo "${{ inputs.task }}" | xargs | tr " " "_")
          ./gradlew ${{ inputs.task }} --no-configuration-cache -Dorg.gradle.unsafe.isolated-projects=false ${{ inputs.extra_args }} \
            -Dscan.tag.seed \
            -Dscan.tag.ip-ac-sc-perf \
            -Dscan.tag.$task_tag \
            -Dscan.tag.run_${{ github.run_id }} \
            -Dscan.value.mode=deps_cache
        env:
          DEVELOCITY_ACCESS_KEY: ${{ secrets.DEVELOCITY_ACCESS_KEY }}

      # Release the file locks and drop the files Gradle rewrites on every
      # build, so the saved dependency cache is clean.
      - name: Stop Gradle
        run: |
          ./gradlew --stop
          rm -f ~/.gradle/caches/modules-2/modules-2.lock ~/.gradle/caches/modules-2/gc.properties

      - name: Save dependencies + wrapper
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches/modules-2
            ~/.gradle/wrapper/dists
          key: ${{ env.DEPS_CACHE_KEY }}

  experiment:
    name: "${{ matrix.scenario }} · iteration ${{ matrix.iteration }}"
    needs: [iterations, seed-deps]
    # seed-deps only runs in deps_cache mode; run anyway, but not if it failed.
    if: ${{ !cancelled() && needs.iterations.result == 'success' && needs.seed-deps.result != 'failure' }}
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJson(inputs.max_parallel) }}
      matrix:
        scenario: [no_cc, cc, ip]
        iteration: ${{ fromJson(needs.iterations.outputs.iterations) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '23'

      - name: Restore dependencies + wrapper
        if: inputs.mode == 'deps_cache'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches/modules-2
            ~/.gradle/wrapper/dists
          key: ${{ env.DEPS_CACHE_KEY }}
          fail-on-cache-miss: true

      - name: Develocity Artifact Cache + Setup Cache
        if: inputs.mode == 'ac_sc'
        uses: gradle/develocity-artifact-cache-github-action@0d55463728b4cb8d76aab3399fcf261cf1fc4fe5 # v1.1.1
        with:
          develocity-url: ${{ env.DEVELOCITY_URL }}
          develocity-access-key: ${{ secrets.DEVELOCITY_ACCESS_KEY }}
          image-names: ip-ac-sc-perf-${{ matrix.scenario }}
          additional-cli-args: |
            --autodetect=GRADLE

      # Never reuse a configuration cache entry, even if one was restored.
      - name: Drop configuration cache entry
        run: rm -rf .gradle/configuration-cache

      - name: Build
        run: |
          case '${{ matrix.scenario }}' in
            no_cc) flags='--no-configuration-cache -Dorg.gradle.unsafe.isolated-projects=false' ;;
            cc)    flags='--configuration-cache -Dorg.gradle.unsafe.isolated-projects=false' ;;
            ip)    flags='-Dorg.gradle.unsafe.isolated-projects=true' ;;
          esac
          task_tag=$(echo "${{ inputs.task }}" | xargs | tr " " "_")
          ./gradlew ${{ inputs.task }} $flags ${{ inputs.extra_args }} \
            -Dscan.tag.${{ inputs.experiment_id }}_${{ inputs.mode }}_${{ matrix.scenario }} \
            -Dscan.tag.experiment \
            -Dscan.tag.ip-ac-sc-perf \
            -Dscan.tag.$task_tag \
            -Dscan.tag.run_${{ github.run_id }} \
            -Dscan.value.scenario=${{ matrix.scenario }} \
            -Dscan.value.iteration=${{ matrix.iteration }} \
            -Dscan.value.mode=${{ inputs.mode }} \
            -Dscan.value.ac_sc=${{ inputs.mode == 'ac_sc' }}
        env:
          DEVELOCITY_ACCESS_KEY: ${{ secrets.DEVELOCITY_ACCESS_KEY }}
